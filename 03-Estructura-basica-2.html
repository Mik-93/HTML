<!-- 
    Para crear la estructura básica de un documento HTML, podemos usar a Emmet.

    Emmet es una herramienta de autocompletado integrada en VSCode que nos permite escribir código HTML y CSS de manera más rápida y eficiente.

    Un shortcut para escribir la estructura: "!"

    Atributo

        "Lang" 👉 determina el idioma en el que está escrito el documento. Esto es importante para la accesibilidad y para los motores de búsqueda.
        "Charset" 👉 define el conjunto de caracteres que se utilizará en el documento. Esto es importante para garantizar que los caracteres especiales se muestren correctamente.

    Etiquetas

        Meta viweport 👉 permite que nuesto documento se vea correctamente en dispositivos móviles, siempre debe de estar. Son selfclosing, ya que no necesitan de una etiqueta de cierre.

        Title 👉 DEFINE EL TITULO DEL DOCUMENTO QUE SE MUESTRA EN LA PESTAÑA DEL NAVEGADOR. Este titulo sí es visible par le usuario y se ubica en las pestañas del navegardor. Caso contrario a Meta viewport, este sí necesita de una etiqueta de cierre

-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiero jugar boblox</title>
</head>
<body>
    
</body>
</html>
