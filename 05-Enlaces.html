<!-- Enlaces

los enlaces nos permiten crear navegación interna y externas html. 

Sintaxis

<a>...</a>

Los enlaces requieren de, atributo 'href' para funciobnar como elementos interactivos

Sintaxis:

<a href="..."> </a>

El atributo "gref" puede recibir varios valores, los principales:
- URL externa
- La ruta (path) de un archivo html
- el id de un elemento de HTML
- #deadlink (enlace muerto)


Los ID son únicos, solo se puede usar uno por párrafo y/o Titulo.

El atributo "Target" nos permite indicarle al enlace que se debe de abrir en unapestaña nueva cuando usamos el valor "_blank"
-->
