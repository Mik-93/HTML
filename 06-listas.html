<!-- Las listas ordenadas llevan numeración.
 sintaxis:
 
<ol> ... </ol>

Las NO ordenadas llevan viñetas.
 sintaxis:  

 <ul> ... </ul>


 Para los elementos de la lista se utiliza la etiqueta <li> ... </li>


 Existe el atributo "type" para cambiar el tipo de numeración de las listas ordenadas.

 1 👉 Tipo número
 a/A 👉 Tipo letra
 i/I 👉 Tipo número romano (Número de lista con número romano)
 
 
 
 el atributo "style" para cambiar el tipo de viñeta de las listas no ordenadas.

 Bullet 👉 Tipo viñeta
    Circle 👉 Tipo círculo
    Square 👉 Tipo cuadrado

 -->

 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiero jugar boblox</title>
</head>
<body>
    <h1>Listas</h1>
    <p>Lista ordenada y no ordenadas</p>
    <h2>Mi comida favorita</h2>
    <ol type="i">
        <li>Sushi</li>
        <li>Pozole</li>
        <li>Mole Poblano</li>
    </ol>
    <h2>Mis Juegos favoritos</h2>
    <ul style="list-style-type: square;">
        <li>Roblox</li>
        <li>Undertale</li>
        <li>Ultrakill</li>
        <li>Dead Cells</li>
    </ul>
</body>
</html>
