Emmet Abbreviations

Nos ayuda a escribir código HTML de manera más rápida y eficiente. A continuación, se presentan algunas abreviaturas de Emmet que pueden ser útiles para crear la estructura básica de un documento HTML:

- El contenido dentro de la etiqueta previa
- Agrega un contenedor al elemento previo

3. Crearemos un main con 5 secciones, cada una con un h2:

h2 - Nombre de la historia (Lo cambiaremos por un h1)
h2 - Historia
h2 - sinopsis
h2 - Personajes
h2 - Trailer

-->

<main>
    <!--  "Hero" Es una especie de portada de nuestro documento web -->
    <section>
        <h1>Scott Pilgrim vs the World</h1>
        <p>Es una película de ciencia ficción que relata la historia de un chico que pelea contra las exparejas de la chica de sus sueños para poder tenerla.</p>
        <button>Ver Trailer</button>
    </section>
    <section>
        <h2>Historia</h2>
    </section>
    <section>
        <h2>Sinopsis</h2>
    </section>
    <section>
        <h2>Personajes</h2>
    </section>
    <section>
        <h2>Trailer</h2>
    </section>
</main>
