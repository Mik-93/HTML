<!-- 
 
Contenido UIncrustado (Iframes)

Sirven para incustar contenido externo conmo videos de yoputube, mapas, documentos, interfaces de otras páginas web, etc.

- src: dirección del contenido
- Width: ancho
- Height: alto
- allowfullscreen: permite que el contenido se muestre en pantalla completa. Es un atributo booleano, es decir, no necesita un valor.

-->


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
</head>
<body>

    <h1>Contenido Incrustado (Iframes)</h1>

    <h2>Video de Youtube</h2>
    <iframe width="auto" height="auto" src="https://www.youtube.com/embed/GVbXa61tdD8?si=akOr3YRSnbKIbdPk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>    

    <h2>Mapa de Google Maps</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3771.3614243510156!2d-98.21385668771043!3d19.0478404820764!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cfc6d4531e0fff%3A0xaf32047582fa31ba!2sAS%20Media%20Centro%20de%20Formaci%C3%B3n%20Profesional%20A.C.!5e0!3m2!1ses-419!2smx!4v1792444657287!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <h2>Revista</h2>
    <iframe src="https://heyzine.com/flip-book/383f213883.html#page/1" frameborder="0" width="1024" height="600"></iframe>
    
</body>
</html>
