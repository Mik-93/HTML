<!-- 

    Estructura básica

        <!DOCTYPE html>  👉 Declara el tipo de documento y laversión de HTML que estamos utilizando.

        <!html> 👉 Es el "elemento raíz" que contiene todo el contenido del documento.
}
        <head> 👉 Contiene metadatos sobre el documento, p. ej. ocnjunto de caracteres, vista para dispositivos móviles, el título, enlaces a hojas de estilo y scripts.

        <title> 👉 Define el título del documento que se muestra en la pestaña del navegador.

        <body> 👉 Contiene el contenido visible de la página web, como texto, imágenes, enlaces, formularios y otros elementos.

-->

<!DOCTYPE html>
<html>
    <head></head>
    <body></body>
</html>
