<!-- 
 
    Etiquetas de texto

        1. Etiquetas de encabezado: <h1> a <h6> 👉 Se utilizan para definir títulos y subtítulos en un documento HTML. <h1> es el título principal, mientras que <h6> es el título de menor importancia
            <h1>...</h1> 👉 Título principal (Solo debe de existir una etiqueta principal en todo el documento)
            <h2>...</h2> 👉 Título secundario
            <h3>...</h3> 👉 Título terciario
            <h4>...</h4> 👉 Título cuarto
            <h5>...</h5> 👉 Título quinto
            <h6>...</h6> 👉 Título sexto

-->
    <h1>Título Principal</h1>
    <h2>Título de segunda jerarquía</h2>
    <h3>Título de tercera jerarquía</h3>     
    <h4>Título de cuarta jerarquía</h4>
    <h5>Título de quinta jerarquía</h5>
    <h6>Título de sexta jerarquía</h6>
